default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        # Sized to fit the vendored cp313 duvc-ctl wheel (~1.2 MB) with
        # headroom. Bumping this should be deliberate — large blobs in git
        # are usually a sign something belongs in LFS or out of the repo.
        args: ["--maxkb=1500"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.16
    hooks:
      - id: uv-lock

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
        # Domain terms (alicat, watlow, sartorius, nidaq, daqmx, qasync,
        # pyqtgraph, parquet) and common false positives the spellchecker
        # snags on capa's vocabulary. Also: absout (PowerShell variable
        # token in tools/build_duvc_wheel.ps1) and doubleclick (Qt
        # mouse-event method-name fragment in zensical.toml filters).
        args:
          - "--ignore-words-list=capa,alicat,watlow,sartorius,nidaq,daqmx,qasync,pyqtgraph,parquet,iso,nin,inout,doub,unparseable,zensical,winloop,uvloop,anyio,arange,absout,doubleclick"
          - "--skip=uv.lock,vendor/*,site/*,runs/*"

  # Local hook — runs mypy at pre-push (not pre-commit) so the per-commit
  # loop stays fast. The project preference is "don't loop on mypy
  # mid-task; pytest is the gate"; pre-push is the right gate for typing.
  # CI runs the same check on every PR.
  #
  # `--frozen` makes the hook fail loudly if uv.lock no longer satisfies
  # the requested groups, so a stale lockfile surfaces here rather than
  # silently re-resolving. The group selection matches CI's typecheck job.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (matches CI typecheck env)
        entry: uv run --frozen --group type --group test mypy
        language: system
        pass_filenames: false
        files: ^(src|tests)/
        stages: [pre-push]

ci:
  autoupdate_schedule: monthly
  # Local-only hooks; CI runs the equivalent via .github/workflows/ci.yml.
  skip: [mypy]
