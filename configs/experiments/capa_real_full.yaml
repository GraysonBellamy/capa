hardware: ../hardware/capa_real_full.toml
method: ../methods/sim_capa_pyrolysis.method.toml
procedure:
  id: capa.builtin.recipe_runner
  version: '0.1'
  config:
    auto_acknowledge_prompts: true
    notes: 'Windows real-hardware run: all six adapters on real devices.'
domain_profile:
  id: capa.profiles.capa_pyrolysis
  metadata:
    specimen:
      # id, material, masses, dimensions and conditioning are entered for
      # each run in the Setup tab, along with the operator.
      form: disk
      specimen_holder: stainless steel cup
    program:
      target_heat_flux_kw_m2: 50.0
      heater_setpoint_c: 600.0
    atmosphere:
      mode: inert
      purge:
        species: Air
        purity: UHP 5.0
        target_flow_slpm: 0.0
device_settings:
  purge_mfc:
    gas: Air
  balance:
    filter_mode: very stable
  ir_cam0:
    temperature_range:
      min_c: 0.0
      max_c: 650.0
    emissivity: 0.95
  visible_cam0:
    zoom: 270
    tilt: 7
    auto_exposure: false
    exposure: -5      # longest that holds 30 fps at 1080p; the camera resets to -4 (16 fps) on stream start
    auto_focus: false
    focus: 15         # middle of the sharp plateau (0-35) on the sample holder
    gain: 48          # fir ~195/255, char ~28; leaves red headroom for the 35 kW/m2 heater glow
    auto_white_balance: false
    white_balance: 5300   # neutral on white paper under the top light, heater off
    sharpness: 64     # no in-camera sharpening (0-64 identical); 128+ adds halos
    brightness: 128
    contrast: 128
    saturation: 128
    backlight_compensation: 0
tags:
  - real
  - full
  - capa
  - pyrolysis
