# CAPA pyrolysis integration — full all-real variant (Windows rig).
# Real: Watlow + Alicat + Sartorius + NI-DAQ + webcam + FLIR E85.

hardware: ../hardware/capa_real_full.toml
method: ../methods/sim_capa_pyrolysis.method.toml

procedure:
  id: capa.builtin.recipe_runner
  version: "0.1"
  config:
    auto_acknowledge_prompts: true
    notes: "Windows real-hardware run: all six adapters on real devices."

domain_profile:
  id: capa.profiles.capa_pyrolysis
  metadata:
    specimen:
      id: REAL-C-001
      material: PMMA
      initial_mass_g: 5.0
      form: disk
      specimen_holder: "stainless steel cup"
      conditioning: "23C / 50% RH for 48h"
    program:
      target_heat_flux_kw_m2: 50.0
      heater_setpoint_c: 600.0
    atmosphere:
      mode: inert
      purge:
        species: N2
        purity: "UHP 5.0"
        target_flow_sccm: 0.0

# Applied to the devices when the config loads, after a confirmation
# dialog that lists anything the devices currently differ on.
device_settings:
  purge_mfc:
    gas: N2
  balance:
    filter_mode: very stable
  ir_cam0:
    temperature_range: {min_c: 0.0, max_c: 650.0}
    emissivity: 0.95
  visible_cam0:
    zoom: 265
    tilt: 5

calibration_set:
  name: default

operator:
  id: abr
  display_name: A. Researcher

sample:
  id: REAL-C-001
  material: PMMA
  mass_g: 5.0

tags:
  - real
  - full
  - capa
  - pyrolysis
