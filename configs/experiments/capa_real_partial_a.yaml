# CAPA pyrolysis integration — variant A (control + visible).
# Real: Watlow + Alicat + webcam. Sim: Sartorius + NI-DAQ.

hardware: ../hardware/capa_real_partial_a.toml
method: ../methods/sim_capa_pyrolysis.method.toml

procedure:
  id: capa.builtin.recipe_runner
  version: "0.1"
  config:
    auto_acknowledge_prompts: true
    notes: "Real-hardware mix: real Watlow+Alicat+webcam, sim balance+NI-DAQ."

domain_profile:
  id: capa.profiles.capa_pyrolysis
  metadata:
    specimen:
      # id, material, masses, dimensions and conditioning are entered for
      # each run in the Setup tab, along with the operator.
      form: disk
      specimen_holder: "stainless steel cup"
    program:
      target_heat_flux_kw_m2: 50.0
      heater_setpoint_c: 600.0
    atmosphere:
      mode: inert
      purge:
        species: N2
        purity: "UHP 5.0"
        target_flow_slpm: 100.0

tags:
  - real
  - partial
  - capa
  - pyrolysis
