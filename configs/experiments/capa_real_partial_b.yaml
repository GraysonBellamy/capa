# CAPA pyrolysis integration — variant B (cameras + mass).
# Real: FLIR E85 + webcam + Sartorius. Sim: Watlow + Alicat + NI-DAQ.

hardware: ../hardware/capa_real_partial_b.toml
method: ../methods/sim_capa_pyrolysis.method.toml

procedure:
  id: capa.builtin.recipe_runner
  version: "0.1"
  config:
    auto_acknowledge_prompts: true
    notes: "Real-hardware mix: real E85+webcam+balance, sim heater+MFC+NI-DAQ."

domain_profile:
  id: capa.profiles.capa_pyrolysis
  metadata:
    specimen:
      id: REAL-B-001
      material: PMMA
      initial_mass_g: 5.0
      form: disk
      specimen_holder: "stainless steel cup"
      conditioning: "23C / 50% RH for 48h"
    program:
      target_heat_flux_kw_m2: 50.0
      heater_setpoint_c: 600.0
    atmosphere:
      mode: inert
      purge_duration_s: 30.0
      purge:
        species: N2
        purity: "UHP 5.0"
        target_flow_sccm: 100.0

calibration_set:
  name: default

operator:
  id: abr
  display_name: A. Researcher

sample:
  id: REAL-B-001
  material: PMMA
  notes: "Mixed-hardware integration"

tags:
  - real
  - partial
  - capa
  - pyrolysis
