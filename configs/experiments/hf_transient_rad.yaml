# Transient heat flux inside the CAPA chamber with the windowed radiometer
# 222091, one flux per run. Same test as hf_transient.yaml (gauge 175681),
# except: the radiometer sits at the specimen position, CENTRED, top face
# level with the sample surface (its calibration,
# configs/calibrations/rad_222091_2026-10-22.toml, holds only centred, at
# 40 mm, under this heater); its N2 window purge is started by hand at
# 0.2 L/min (the MC-500 isn't connected, so it is not logged); the heater-on
# period is a fixed 30 min; webcam only, no IR camera.
#
# Per flux:
#   1. Tune open air over the reference at 40 mm with
#      configs/experiments/hf_transient_tune.yaml (edit its target first).
#      It ends with the heater HOLDING at the setpoint it found.
#   2. Remove the reference, switch the cooling water to the chamber loop,
#      fill in the sample extras below (flux and the tuned setpoint from the
#      tune's "holding" event), then run this config.
#
# The method (configs/methods/hf_transient_rad.method.toml) never touches
# the heater or the window purge. It prompts for the window purge, turns
# the air purge on at 185 SLPM (aborting if purge.flow hasn't reached 180
# within 30 s: air supply shut), records 30 s of flush and a 2 min
# baseline, prompts for the heater to go on, records 30 min from that
# Continue, prompts for the heater to come off, records 2 min more, then
# turns the air purge off. The heater keeps holding. The
# step.entered/exited events tagged "hftrans win=..." mark the windows;
# contact_switch may give a sharper heater-on/off time than the prompt
# clicks.
#
# During the run: the radiometer has no body thermocouple, so check the
# cooling-water flow by eye; a steady upward drift in rad_222091 while
# the heater holds steady may be a cooling problem. CAPA's safety rules
# are not enforced yet. Stop leaves the heater and the air purge at their
# last setpoints: set the MCR-200 to 0 by hand after a Stop.
#
# Run with:
#
#   uv run capa validate --strict configs/experiments/hf_transient_rad.yaml
#   uv run capa gui configs/experiments/hf_transient_rad.yaml --runs-root runs/hf_transient

hardware: ../hardware/hf_transient_rad.toml
method: ../methods/hf_transient_rad.method.toml

procedure:
  id: capa.builtin.recipe_runner
  version: "0.1"
  config:
    auto_acknowledge_prompts: false
    notes: "Transient heat flux at the specimen position, radiometer 222091, 30 min heater-on"

operator:
  id: gbellamy
  display_name: Grayson Bellamy

device_settings:
  purge_mfc:
    gas: Air
  visible_cam0:
    zoom: 270
    tilt: 7
    auto_exposure: false
    exposure: -5      # longest that holds 30 fps at 1080p; the camera resets to -4 (16 fps) on stream start
    auto_focus: false
    focus: 15         # middle of the sharp plateau (0-35) on the sample holder
    gain: 48          # fir ~195/255, char ~28; leaves red headroom for the 35 kW/m2 heater glow
    auto_white_balance: false
    white_balance: 5300   # neutral on white paper under the top light, heater off
    sharpness: 64     # no in-camera sharpening (0-64 identical); 128+ adds halos
    brightness: 128
    contrast: 128
    saturation: 128
    backlight_compensation: 0

sample:
  id: SET_ME   # HFT_222091_<flux>kW_r<n>, e.g. HFT_222091_20kW_r1
  material: Radiometer 222091 at the specimen position
  notes: "Transient heat flux at the specimen position under air purge, 30 min heater-on"
  extra:
    gauge_model: "Medtherm 24P-10SB-24-21062"
    gauge_serial: "222091"
    gauge_calibration: rad_222091_2026-10-22
    target_flux_kw_m2: null          # 20, 30, 50, 70 (calibrated 14.8-69.5)
    tuned_setpoint_c: null           # from the tune's heat_flux_tune.holding event
    tuned_flux_kw_m2: null           # reference reading the tune accepted
    heater_to_face_mm: 40.0          # heater base to the radiometer's top face
    face_vs_sample_surface_mm: 0.0   # + = top face above the sample surface plane
    heater_on_duration_s: 1800.0
    window_purge_gas: N2
    window_purge_l_min: 0.2          # set by hand, not logged
    window_purge_mfc: "Alicat MC-500SCCM-D SN 125238 (front panel)"
    purge_gas: Air
    purge_flow_slpm: 185.0
    purge_mfc: "Alicat MCR-200SLPM-D SN 225873"
    cooling: "separate loop + building supply"
    cooling_water_temp_c: null
    cooling_water_flow_ml_s: null

tags:
  - real
  - heat-flux
  - hf-transient
  - radiometer
