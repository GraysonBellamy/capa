# HFG2 transfer calibration against the Medtherm reference, open air,
# 5-70 kW/m2 (docs/calibration/heat-flux-gauge-transfer.md). The pilot
# (hfg_transfer_pilot.yaml) is optional; if one moves the setpoints, update
# the table in scripts/make_hfg_transfer_methods.py and rerun that script.
#
# Twelve levels: 5, 10, 15, 20, 30, 40, 50, 60, 70 kW/m2 going up, then
# 50, 30, 10 going down. At each level the method waits for the heater
# PV, settles (15 min at level 1, 10 min after), then records 70 s on the
# reference, prompts a slide to HFG2, 70 s, prompts a slide back, 70 s.
# Click Continue only once the heater is at the stop. About 3.5 h.
#
# Before Start (same as the pilot):
#   - heater cold, PV within 2 degC of the room, at stop A. The heater
#     can't slide clear of the gauges, so the run's only zero is this cold
#     one at the start
#   - both gauges water-cooled from the same loop for >= 5 min; HFG2 body
#     temperature (ai4) steady near the water temperature and above the
#     dew point from the ambient sensor
#   - gauges seated with faces level, stops A and B set
#   - hood or room ventilation in its run state and left alone
#   - sample extras below filled in
#
# During the run: watch hfg2.body_temperature. If it climbs more than
# ~5 degC above the water temperature, stop the run (cooling problem).
# CAPA's safety rules are not enforced yet, so this is a manual watch.
# A level is spoiled by a bump, a late or early slide, or a reach-wait
# timeout warning: note the level number and rerun that level afterwards.
#
# Run with:
#
#   uv run capa validate --strict configs/experiments/hfg_transfer_cal.yaml
#   uv run capa gui configs/experiments/hfg_transfer_cal.yaml --runs-root runs/hfg_transfer_cal

hardware: ../hardware/hfg_transfer_cal.toml
method: ../methods/hfg_transfer_cal.method.toml

procedure:
  id: capa.builtin.recipe_runner
  version: "0.1"
  config:
    auto_acknowledge_prompts: false
    notes: "HFG2 transfer calibration: 5-70 kW/m2"

operator:
  id: gbellamy
  display_name: Grayson Bellamy

sample:
  id: SET_ME   # e.g. HFG2_<serial>_cal1; a real-looking default slips through
  material: Heat-flux gauge under calibration (HFG2)
  notes: "Open-air transfer calibration, R D R per level, 5-70 kW/m2"
  extra:
    hfg2_model: null
    hfg2_serial: null
    hfg2_range_kw_m2: 113.6          # 10 BTU/(ft^2 s); rated to 150 % overrange
    reference_serial: "232041"
    heater_to_face_mm: 40.0          # standoff, heater base to reference face (as the rig tunes)
    face_height_diff_mm: null        # HFG2 face minus reference face (+ = HFG2 higher)
    gauge_spacing_mm: null           # centre to centre = slide travel A -> B
    cooling_water_temp_c: null
    cooling_water_flow_lpm: null
    lab_air_temp_c: null
    lab_rh_percent: null
    ventilation: null                # hood/fan state during the run
    spoiled_levels: []               # level numbers to rerun, filled in after the run

tags:
  - real
  - calibration
  - heat-flux
  - hfg-transfer
