# End-to-end CAPA pyrolysis recipe driven by RecipeRunner.
# Loads the CAPA-shaped sim hardware profile and the matching method.

hardware: ../hardware/sim_capa.toml
method: ../methods/sim_capa_pyrolysis.method.toml

procedure:
  id: capa.builtin.recipe_runner
  version: "0.1"
  config:
    auto_acknowledge_prompts: true
    notes: "CAPA sim smoke: ramp under N2, soak, cool down."

domain_profile:
  id: capa.profiles.capa_pyrolysis
  metadata:
    specimen:
      id: SIM-PMMA-001
      material: PMMA
      initial_mass_g: 5.0
      form: disk
      specimen_holder: "stainless steel cup"
      conditioning: "23C / 50% RH for 48h"
    program:
      target_heat_flux_kw_m2: 50.0
      heater_setpoint_c: 600.0
    atmosphere:
      mode: inert
      purge_duration_s: 30.0
      purge:
        species: N2
        purity: "UHP 5.0"
        target_flow_sccm: 100.0
    # The capa.heater_pv_in_safe_range gate defaults to a 1000 °C
    # rig-survival ceiling, so the sim's 600 °C ramp passes without
    # an explicit override. Add ``_safe_arm.max_heater_pv_c`` here if
    # a future test wants a tighter gate per-method.

calibration_set:
  name: default

operator:
  id: abr
  display_name: A. Researcher

sample:
  id: SIM-CAPA-001
  material: PMMA
  notes: "CAPA sim smoke run"

tags:
  - sim
  - capa
  - pyrolysis
