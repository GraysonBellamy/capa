# CAPA pyrolysis integration profile — Windows full-real variant.
#
# All six devices on real silicon at once. Possible on the Windows rig
# because every adapter (Watlow, Alicat, Sartorius, NI-DAQ, webcam, FLIR
# E85) has a working driver path here; the original Linux session split
# this into two partial runs because NI-DAQ and FLIR E85 had no usable
# Linux driver. Channels match the capa.profiles.capa_pyrolysis required
# groups so the same method drives it.

name = "capa_real_full"

# --- Real heater controller ---
[[devices]]
name = "heater"
adapter = "capa.devices.watlow"
[devices.params]
port = "COM6"
address = 1
protocol = "stdbus"
parameters = ["process_value", "setpoint"]
instances = [1]
rate_hz = 1.0
auto_reconnect = true
snapshot_period_s = 30.0
identify_on_open = true
io_timeout_s = 2.0
# Operator-asserted wire scale (watlowlib 0.4 requires this).
# Empirically verified on PM3R1CA fw=1: with panel set to °C, panel
# reads PV=18.7 and SP=-6.7 while comms reports 65.65 and 20.0 —
# 65.65°F = 18.69°C, 20°F = -6.67°C. The wire is in Fahrenheit
# regardless of what panel-display registers (3005/17050) report. The
# heater channel calibrations convert F → C so downstream stays in °C.
wire_temperature_unit = "F"

# --- Real carrier MFC ---
[[devices]]
name = "purge_mfc"
adapter = "capa.devices.alicat"
[devices.params]
port = "COM7"
unit_id = "A"
baudrate = 115200
rate_hz = 2.0
auto_reconnect = true
snapshot_period_s = 30.0

# --- Real balance ---
[[devices]]
name = "balance"
adapter = "capa.devices.sartorius"
[devices.params]
port = "COM4"
protocol = "xbpi"
baudrate = 57600
src_sbn = 1
dst_sbn = 9
rate_hz = 50.0
auto_reconnect = true
snapshot_period_s = 30.0

# --- Real NI-DAQ thermocouples (NI 9214 in cDAQ-9171) ---
[[devices]]
name = "cdaq1"
adapter = "capa.devices.nidaq"
[devices.params]
task_name = "default_task"
rate_hz = 5.0
snapshot_period_s = 30.0
auto_reconnect = false
overflow = "block"

[[devices.params.channels]]
kind = "thermocouple"
physical_channel = "cDAQ1Mod1/ai0"
name = "TC_top_1"
thermocouple_type = "K"
min_val = 0.0
max_val = 1000.0
cjc_source = "BUILT_IN"
units = "DEG_C"
adc_timing_mode = "HIGH_RESOLUTION"
auto_zero_mode = "ONCE"

[[devices.params.channels]]
kind = "thermocouple"
physical_channel = "cDAQ1Mod1/ai1"
name = "TC_top_2"
thermocouple_type = "K"
min_val = 0.0
max_val = 1000.0
cjc_source = "BUILT_IN"
units = "DEG_C"
adc_timing_mode = "HIGH_RESOLUTION"
auto_zero_mode = "ONCE"

# Schmidt-Boelter heat-flux gauge — low-level millivolt analog input on
# the NI 9214 (which is what we actually use; the 9214 supports both
# thermocouple and low-level voltage AI on the same module). Wire-side
# is volts; the channel calibration below converts to kW/m^2.
#
# IMPORTANT: any "CAPA HFG" named scale in NI MAX must be removed
# (or set to identity) on this physical channel. The software-side
# LinearTwoPoint calibration in the [[channels]] block below is the
# authoritative V → kW/m^2 mapping; a driver-side scale would silently
# double-apply and the keep_raw audit becomes meaningless.
[[devices.params.channels]]
kind = "ai_voltage"
physical_channel = "cDAQ1Mod1/ai14"
name = "AI_HFG"
# Gauge sensitivity: ~7.77 mV per 100 kW/m^2 (cert slope 12867.29 kW/m^2
# per V). Range gives ~2.5x headroom past a 100 kW/m^2 target before
# the AI saturates at the NI 9214's low-level voltage rail.
min_val = -0.001
max_val = 0.020
terminal_config = "DIFF"
adc_timing_mode = "HIGH_RESOLUTION"
auto_zero_mode = "ONCE"

# --- Real visible camera ---
[[cameras]]
name = "visible_cam0"
adapter = "capa.devices.camera.webcam"
kind = "visible"
model_hint = "C930e"
estimated_bps = 1_500_000
on_failure = "warn"
[cameras.params]
fps = 30
width = 1920
height = 1080
codec = "h264_qsv"
pix_fmt = "nv12"
input_format = "dshow"
input_url = "video=Logitech Webcam C930e"

# --- Real IR camera (E85). No model_hint — Windows enumerates it as
#     "FLIR USB Video" so a literal "FLIR E85" hint would mismatch.
[[cameras]]
name = "ir_cam0"
adapter = "capa_flir.flir_ir"
kind = "ir"
estimated_bps = 4_500_000
on_failure = "warn"
[cameras.params]
circular_buffer_frames = 60
compression = false
discovery_timeout_s = 5.0

# --- Controller channels (heater) ---

# Wire is °F (see wire_temperature_unit on the heater device above);
# the two-point linear calibration converts to °C for downstream.
# Reference pairs are the F/C definition points: (32 °F, 0 °C) and
# (212 °F, 100 °C).
[[channels]]
name = "heater.pv"
kind = "process_var"
unit = "degF"
derived_unit = "degC"
plot_group = "temperatures"
[channels.metadata]
capa_group = "heater_pv"
[channels.source]
source = "watlow_parameter"
device = "heater"
parameter = "process_value"
instance = 1
[channels.calibration]
kind = "linear_two_point"
input_unit = "degF"
output_unit = "degC"
ref_low_raw = 32.0
ref_low_value = 0.0
ref_high_raw = 212.0
ref_high_value = 100.0

[[channels]]
name = "heater.setpoint"
kind = "setpoint"
unit = "degF"
derived_unit = "degC"
plot_group = "temperatures"
[channels.metadata]
capa_group = "heater_setpoint"
[channels.source]
source = "watlow_parameter"
device = "heater"
parameter = "setpoint"
instance = 1
[channels.calibration]
kind = "linear_two_point"
input_unit = "degF"
output_unit = "degC"
ref_low_raw = 32.0
ref_low_value = 0.0
ref_high_raw = 212.0
ref_high_value = 100.0

# --- Carrier gas (Alicat) ---

[[channels]]
name = "purge.flow"
kind = "mfc_flow"
unit = "slpm"
derived_unit = "slpm"
plot_group = "flows"
[channels.metadata]
capa_group = "purge_gas_flow"
[channels.source]
source = "alicat_frame_field"
device = "purge_mfc"
field = "Mass_Flow"
[channels.calibration]
kind = "identity"
input_unit = "slpm"
output_unit = "slpm"

# --- Sample-thermocouples (NI 9214) ---

[[channels]]
name = "TC_sample_top"
kind = "tc"
unit = "degC"
derived_unit = "degC"
plot_group = "temperatures"
[channels.metadata]
capa_group = "sample_temperature"
[channels.source]
source = "nidaq_reading_field"
device = "cdaq1"
task = "default_task"
field = "TC_top_1"
[channels.calibration]
kind = "identity"
input_unit = "degC"
output_unit = "degC"

[[channels]]
name = "TC_sample_mid"
kind = "tc"
unit = "degC"
derived_unit = "degC"
plot_group = "temperatures"
[channels.metadata]
capa_group = "sample_temperature"
[channels.source]
source = "nidaq_reading_field"
device = "cdaq1"
task = "default_task"
field = "TC_top_2"
[channels.calibration]
kind = "identity"
input_unit = "degC"
output_unit = "degC"

# --- Heat-flux gauge (Schmidt-Boelter; raw V → calibrated kW/m^2) ---
#
# Used by the `capa.builtin.heat_flux_tune` procedure to drive the heater
# setpoint to a target radiant heat flux at the specimen plane. Required
# only for tune runs; specimen runs do not depend on the gauge being
# present. keep_raw=true so the wire-side volts land in the bundle for
# instrument-side audit.
#
# The NI 9214 returns volts; the linear-two-point below applies the
# rig's gauge-cert linear fit F = 12867.29134 * V - 0.064771278 by
# encoding the function at V=0 and V=0.010 V (matching the gauge cert).
# Equivalent to the named NI MAX scale "CAPA HFG" — that scale must
# NOT be applied on this physical channel (see [[devices.params.channels]]
# block above for AI_HFG).
[[channels]]
name = "heat_flux_gauge"
kind = "analog_in"
unit = "V"
derived_unit = "kW/m^2"
keep_raw = true
plot_group = "heat_flux"
[channels.metadata]
capa_group = "heat_flux_gauge"
gauge_type = "Schmidt-Boelter"
position = "40 mm below heater, centerline"
[channels.source]
source = "nidaq_reading_field"
device = "cdaq1"
task = "default_task"
field = "AI_HFG"
[channels.calibration]
kind = "linear_two_point"
input_unit = "V"
output_unit = "kW/m^2"
# Encodes F = 12867.29134 V - 0.064771278 (rig gauge cert):
#   V = 0.000 V  ->  F = -0.064771278 kW/m^2
#   V = 0.010 V  ->  F = 128.6081421  kW/m^2
ref_low_raw = 0.0
ref_low_value = -0.064771278
ref_high_raw = 0.010
ref_high_value = 128.6081421
[channels.calibration.uncertainty]
kind = "relative"
value = 0.03
coverage_factor = 2.0
method = "manufacturer cert + reference comparison"
# Replace with the cert's stated uncertainty if it differs from the 3%
# k=2 placeholder.
[channels.calibration.fit_metadata]
reference_instrument = "Medtherm Corporation 32-10SB-18-20608"
reference_serial = "232041"
# fitted_at is a deliberate Unix-epoch placeholder until the real cert-issue
# date is available (any ISO-8601 datetime; the value drives no automated
# behaviour but is part of the bundle's calibration pedigree).
fitted_at = 1970-01-01T00:00:00Z
notes = "linear fit: slope 12867.29134 kW/m^2/V, intercept -0.064771278 kW/m^2 (named NI MAX scale 'CAPA HFG'); applied software-side, not via the driver scale. fitted_at is a placeholder; replace with the actual cert date when available."

# --- Mass (Sartorius) ---

[[channels]]
name = "balance.mass"
kind = "mass"
unit = "g"
derived_unit = "g"
plot_group = "mass"
[channels.metadata]
capa_group = "mass"
[channels.source]
source = "sartorius_reading"
device = "balance"
field = "value"
[channels.calibration]
kind = "identity"
input_unit = "g"
output_unit = "g"
