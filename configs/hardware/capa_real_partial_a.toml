# CAPA pyrolysis integration profile — variant A (control + visible).
#
# Real silicon: Watlow + Alicat + external webcam.
# Sim devices: Sartorius balance, NI-DAQ thermocouples (no Linux driver).
# Channels match the capa.profiles.capa_pyrolysis required groups so the
# same method (configs/methods/sim_capa_pyrolysis.method.toml) drives it.

name = "capa_real_partial_a"

# --- Real heater controller ---
[[devices]]
name = "heater"
adapter = "capa.devices.watlow"
[devices.params]
port = "COM6"
address = 1
protocol = "stdbus"
parameters = ["process_value", "setpoint"]
instances = [1]
rate_hz = 1.0
auto_reconnect = true
snapshot_period_s = 30.0
identify_on_open = true
# Operator-asserted wire scale (watlowlib 0.4 requires this).
# Empirically verified on PM3R1CA fw=1: with panel set to °C, panel
# reads PV=18.7 and SP=-6.7 while comms reports 65.65 and 20.0 —
# 65.65°F = 18.69°C, 20°F = -6.67°C. The wire is in Fahrenheit
# regardless of what panel-display registers (3005/17050) report. The
# heater channel calibrations convert F → C so downstream stays in °C.
wire_temperature_unit = "F"

# --- Real carrier MFC ---
[[devices]]
name = "purge_mfc"
adapter = "capa.devices.alicat"
[devices.params]
port = "COM7"
unit_id = "A"
baudrate = 115200
rate_hz = 2.0
auto_reconnect = true
snapshot_period_s = 30.0

# --- Sim balance (real one belongs to variant B) ---
[[devices]]
name = "balance"
adapter = "capa.devices.sim.sartorius_sim"
[devices.params.mass_signal]
kind = "ramp"
start = 5.0
end = 4.0
duration_s = 30.0

# --- Sim NI-DAQ thermocouples (no Linux driver) ---
[[devices]]
name = "cdaq1"
adapter = "capa.devices.sim.nidaq_polled_sim"
[devices.params.signals.TC_top_1]
kind = "ramp"
start = 303.0
end = 873.0
duration_s = 30.0
[devices.params.signals.TC_top_2]
kind = "ramp"
start = 303.0
end = 873.0
duration_s = 30.0

# --- Real visible camera ---
[[cameras]]
name = "visible_cam0"
adapter = "capa.devices.camera.webcam"
kind = "visible"
estimated_bps = 1_500_000
on_failure = "warn"
[cameras.params]
fps = 30
width = 1280
height = 720
codec = "libx264"
pix_fmt = "yuv420p"
input_format = "dshow"
input_url = "video=Logitech Webcam C930e"

# --- Controller channels (heater) ---

# Wire is °F (see wire_temperature_unit on the heater device above);
# the two-point linear calibration converts to °C for downstream.
# Reference pairs are the F/C definition points: (32 °F, 0 °C) and
# (212 °F, 100 °C).
[[channels]]
name = "heater.pv"
kind = "process_var"
unit = "degF"
derived_unit = "degC"
plot_group = "temperatures"
[channels.metadata]
capa_group = "heater_pv"
[channels.source]
source = "watlow_parameter"
device = "heater"
parameter = "process_value"
instance = 1
[channels.calibration]
kind = "linear_two_point"
input_unit = "degF"
output_unit = "degC"
ref_low_raw = 32.0
ref_low_value = 0.0
ref_high_raw = 212.0
ref_high_value = 100.0

[[channels]]
name = "heater.setpoint"
kind = "setpoint"
unit = "degF"
derived_unit = "degC"
plot_group = "temperatures"
[channels.metadata]
capa_group = "heater_setpoint"
[channels.source]
source = "watlow_parameter"
device = "heater"
parameter = "setpoint"
instance = 1
[channels.calibration]
kind = "linear_two_point"
input_unit = "degF"
output_unit = "degC"
ref_low_raw = 32.0
ref_low_value = 0.0
ref_high_raw = 212.0
ref_high_value = 100.0

# --- Carrier gas (real Alicat) ---

[[channels]]
name = "purge.flow"
kind = "mfc_flow"
unit = "slpm"
derived_unit = "slpm"
plot_group = "flows"
[channels.metadata]
capa_group = "purge_gas_flow"
[channels.source]
source = "alicat_frame_field"
device = "purge_mfc"
field = "Mass_Flow"
[channels.calibration]
kind = "identity"
input_unit = "slpm"
output_unit = "slpm"

# --- Sample-thermocouples (sim NI-DAQ) ---

[[channels]]
name = "TC_sample_top"
kind = "tc"
unit = "K"
derived_unit = "K"
plot_group = "temperatures"
[channels.metadata]
capa_group = "sample_temperature"
[channels.source]
source = "nidaq_reading_field"
device = "cdaq1"
task = "default_task"
field = "TC_top_1"
[channels.calibration]
kind = "identity"
input_unit = "K"
output_unit = "K"

[[channels]]
name = "TC_sample_mid"
kind = "tc"
unit = "K"
derived_unit = "K"
plot_group = "temperatures"
[channels.metadata]
capa_group = "sample_temperature"
[channels.source]
source = "nidaq_reading_field"
device = "cdaq1"
task = "default_task"
field = "TC_top_2"
[channels.calibration]
kind = "identity"
input_unit = "K"
output_unit = "K"

# --- Mass (sim balance) ---

[[channels]]
name = "balance.mass"
kind = "mass"
unit = "g"
derived_unit = "g"
plot_group = "mass"
[channels.metadata]
capa_group = "mass"
[channels.source]
source = "sartorius_reading"
device = "balance"
field = "value"
[channels.calibration]
kind = "identity"
input_unit = "g"
output_unit = "g"
