name = "flir_e85_real"

# Single FLIR E85 IR camera over USB. Resolved via the
# ``capa_flir.flir_ir`` module path; capa core doesn't bundle the FLIR
# Atlas SDK so this profile only loads if the ``capa-flir`` package is
# installed in the active environment.
[[cameras]]
name = "ir_cam0"
adapter = "capa_flir.flir_ir"
kind = "ir"
# Windows FLIR USB driver enumerates the E85 with model="FLIR USB Video"
# (a generic vendor string), so the literal "FLIR E85" model_hint that
# works on macOS / Linux Atlas builds doesn't match here. Leave the hint
# blank — the only USB-IR camera connected at hardware-day time is the
# one we want, so disambiguation isn't needed. Switch to a serial-based
# selector once we have multiple FLIR cameras on the rig.
estimated_bps = 4_500_000   # 30 Hz uncompressed .csq, conservative
on_failure = "warn"
[cameras.params]
circular_buffer_frames = 60
compression = false
discovery_timeout_s = 5.0
