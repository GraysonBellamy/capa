name = "flux_tune"

# Open-air heater tune to a target flux: the CAPA heater off the chamber,
# reference gauge 232041 (Medtherm 32-10SB-18-20608, no body thermocouple)
# centred 40 mm below it. The heater controller, the reference gauge on the
# NI 9214 (cDAQ1Mod1/ai14), and the lab-air sensors (SHT45 + BMP581) as
# metadata. No chamber, balance, MFC or cameras.
#
# The tune records only flux, heater PV and setpoint as channels; the
# SHT45 and BMP581 readings land in the run's device_records/ (1 Hz).

[[devices]]
name = "heater"
adapter = "capa.devices.watlow"

[devices.params]
port = "COM6"
address = 1
protocol = "stdbus"
parameters = [
    "process_value",
    "setpoint",
    "output_power",  # PID output %, logged to device_records (no channel)
]
instances = [
    1,
]
rate_hz = 1.0
auto_reconnect = true
snapshot_period_s = 30.0
identify_on_open = true
io_timeout_s = 2.0
wire_temperature_unit = "F"

[[devices]]
name = "cdaq1"
adapter = "capa.devices.nidaq"

[devices.params]
task_name = "default_task"
rate_hz = 3.0
snapshot_period_s = 30.0
auto_reconnect = false
overflow = "block"

# Reference gauge 232041, wired as in capa_real_full.toml.
[[devices.params.channels]]
kind = "ai_voltage"
physical_channel = "cDAQ1Mod1/ai14"
name = "AI_HFG"
min_val = -0.001
max_val = 0.02
terminal_config = "DIFF"
adc_timing_mode = "HIGH_RESOLUTION"
auto_zero_mode = "EVERY_SAMPLE"

[[devices]]
name = "ambient"
adapter = "capa.devices.sht4x"
on_failure = "warn"

[devices.params]
i2c_address = 0x44
precision = "high"
rate_hz = 1.0
auto_reconnect = true
snapshot_period_s = 30.0

# BMP58x barometer on the same MCP2221 bridge as the SHT4x: both adapters
# share one worker and one HID handle, so i2c_speed_hz (when set) must match.
[[devices]]
name = "baro"
adapter = "capa.devices.bmp58x"
on_failure = "warn"

[devices.params]
i2c_address = 0x47
pressure_oversampling = 64
temperature_oversampling = 4
rate_hz = 1.0
auto_reconnect = true
snapshot_period_s = 30.0

[[channels]]
name = "heater.pv"
kind = "process_var"
unit = "degF"
derived_unit = "degC"
plot_group = "temperatures"

[channels.source]
source = "watlow_parameter"
device = "heater"
parameter = "process_value"
instance = 1

[channels.calibration]
kind = "linear_two_point"
input_unit = "degF"
output_unit = "degC"
ref_low_raw = 32.0
ref_low_value = 0.0
ref_high_raw = 212.0
ref_high_value = 100.0

[channels.metadata]
capa_group = "heater_pv"

[[channels]]
name = "heater.setpoint"
kind = "setpoint"
unit = "degF"
derived_unit = "degC"
plot_group = "temperatures"

[channels.source]
source = "watlow_parameter"
device = "heater"
parameter = "setpoint"
instance = 1

[channels.calibration]
kind = "linear_two_point"
input_unit = "degF"
output_unit = "degC"
ref_low_raw = 32.0
ref_low_value = 0.0
ref_high_raw = 212.0
ref_high_value = 100.0

[channels.metadata]
capa_group = "heater_setpoint"

# Same name and certificate as the rig channel, so the reference flux is
# computed the same way in both places. keep_raw records the volts the
# analysis zero-corrects.
[[channels]]
name = "heat_flux_gauge"
kind = "analog_in"
unit = "V"
derived_unit = "kW/m^2"
plot_group = "heat_flux"
keep_raw = true

[channels.source]
source = "nidaq_reading_field"
device = "cdaq1"
task = "default_task"
field = "AI_HFG"

[channels.calibration]
kind = "linear_two_point"
input_unit = "V"
output_unit = "kW/m^2"
ref_low_raw = 0.0
ref_low_value = -0.064771278
ref_high_raw = 0.01
ref_high_value = 130.2004287  # 13026.52 kW/m2/V x 0.01 V - 0.064771278 (2026-11-22)

[channels.calibration.uncertainty]
kind = "relative"
value = 0.016             # standard (k=1): +-3.2 % at k=2, mostly NIST's unstated value (1.5 % assumed); capa multiplies by coverage_factor
coverage_factor = 2.0
method = "transfer from NIST-calibrated 223481 (NIST 2022 cone-heater value), open air, 2026-11-22 (configs/calibrations/hfg_223481_2022-12-19.toml)"

[channels.calibration.fit_metadata]
reference_instrument = "Medtherm GTW-10SB-4-36-40-484 (NIST-calibrated transfer standard)"
reference_serial = "223481"
fitted_at = 2026-11-22T17:28:03Z
source_procedure_id = "capa.builtin.recipe_runner (hfg_transfer_cal methods) + scripts/analyze_hfg_transfer.py"
capa_git_sha = "80ff2d0-dirty"
notes = "This gauge: Medtherm 32-10SB-18-20608 SN 232041. Slope 13026.52 kW/m^2/V = previous 12867.29134 x 1.012375: on 2026-11-22 (run 2026-11-22_141726_HFG2_223481_cal1) 223481 read 108.461 uV per kW/m^2 on the previous scale, against NIST's 2022 cone-heater value 107.135 (9334 kW/m^2/V). NIST's tungsten-lamp fit would give 13143 (+0.9 %); 180253's corrected NIST 2013 value 13328 (+2.3 %). Intercept -0.064771278 kW/m^2 kept from the NI MAX scale 'CAPA HFG'. Applied software-side, not via the driver scale. The transfer's stop asymmetry (1.5 % between estimators) is not in the uncertainty."

[channels.metadata]
capa_group = "heat_flux_gauge"
gauge_type = "Schmidt-Boelter"
position = "open air, 40 mm below heater, centreline (heater off the chamber)"

# --- Ambient air (SHT45 + BMP581 on the MCP2221 bridge; optional) ---

[[channels]]
name = "ambient.temperature"
kind = "temperature"
unit = "degC"
derived_unit = "degC"
plot_group = "ambient"

[channels.source]
source = "sht4x_reading"
device = "ambient"
field = "temperature"

[channels.calibration]
kind = "identity"
input_unit = "degC"
output_unit = "degC"

[channels.metadata]
capa_group = "ambient_temperature"

[[channels]]
name = "ambient.humidity"
kind = "humidity"
unit = "percent"
derived_unit = "percent"
plot_group = "ambient"

[channels.source]
source = "sht4x_reading"
device = "ambient"
field = "humidity"

[channels.calibration]
kind = "identity"
input_unit = "percent"
output_unit = "percent"

[channels.metadata]
capa_group = "ambient_humidity"

[[channels]]
name = "ambient.pressure"
kind = "pressure"
unit = "Pa"
derived_unit = "Pa"
plot_group = "ambient_pressure"

[channels.source]
source = "bmp58x_reading"
device = "baro"
field = "pressure"

[channels.calibration]
kind = "identity"
input_unit = "Pa"
output_unit = "Pa"

[channels.metadata]
capa_group = "ambient_pressure"
