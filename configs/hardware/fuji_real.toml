name = "fuji_real"

# Single real Fuji ZP-series gas analyzer (ZPA; also sold as the CAI ZPA).
# Adjust ``port`` and ``address`` to match the rig; the link is Modbus RTU at
# a fixed 38400 8-N-1. ``channel_map`` asserts which gas each analyzer
# channel carries: the analyzer's type code only suggests it.
[[devices]]
name = "analyzer"
adapter = "capa.devices.fuji"
[devices.params]
port = "COM8"
address = 1
rate_hz = 1.0
auto_reconnect = true
snapshot_period_s = 30.0
[devices.params.channel_map]
CH1 = "co2"
CH2 = "co"
CH3 = "o2"

# --- Channels ---

[[channels]]
name = "gas.co2"
kind = "gas_concentration"
unit = "percent"
derived_unit = "percent"
plot_group = "gases"
[channels.source]
source = "fuji_channel"
device = "analyzer"
channel = "CH1"
[channels.calibration]
kind = "identity"
input_unit = "percent"
output_unit = "percent"

[[channels]]
name = "gas.co"
kind = "gas_concentration"
unit = "percent"
derived_unit = "percent"
plot_group = "gases"
[channels.source]
source = "fuji_channel"
device = "analyzer"
channel = "CH2"
[channels.calibration]
kind = "identity"
input_unit = "percent"
output_unit = "percent"

[[channels]]
name = "gas.o2"
kind = "gas_concentration"
unit = "percent"
derived_unit = "percent"
plot_group = "gases"
[channels.source]
source = "fuji_channel"
device = "analyzer"
channel = "CH3"
[channels.calibration]
kind = "identity"
input_unit = "percent"
output_unit = "percent"

# Each reading's validity (live, held, calibrating, settling, ...) is in
# device_records/fuji.parquet and in the status of every sample. A channel
# with ``field = "valid"`` (1 while live, 0 otherwise) is needed only when an
# alarm or a procedure has to watch it, so none is declared here. Give one
# ``plot = false`` to keep it off the plots. See docs/devices/fuji.md.
