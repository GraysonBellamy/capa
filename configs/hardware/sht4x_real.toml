# Standalone SHT4x ambient sensor on an MCP2221 USB-I2C bridge.
#
# Logs the lab's air temperature and relative humidity at 1 Hz. The bridge
# is found by USB vendor/product id; with one bridge on the PC no serial is
# needed. The sensor is not required by the CAPA profile, so a fault only
# degrades the run (on_failure = "warn").

name = "sht4x_real"

[[devices]]
name = "ambient"
adapter = "capa.devices.sht4x"
on_failure = "warn"

[devices.params]
i2c_address = 0x44
precision = "high"
rate_hz = 1.0
i2c_speed_hz = 100000
auto_reconnect = true
snapshot_period_s = 30.0

[[channels]]
name = "ambient.temperature"
kind = "temperature"
unit = "degC"
derived_unit = "degC"
plot_group = "ambient"

[channels.source]
source = "sht4x_reading"
device = "ambient"
field = "temperature"

[channels.calibration]
kind = "identity"
input_unit = "degC"
output_unit = "degC"

[channels.metadata]
capa_group = "ambient_temperature"

[[channels]]
name = "ambient.humidity"
kind = "humidity"
unit = "percent"
derived_unit = "percent"
plot_group = "ambient"

[channels.source]
source = "sht4x_reading"
device = "ambient"
field = "humidity"

[channels.calibration]
kind = "identity"
input_unit = "percent"
output_unit = "percent"

[channels.metadata]
capa_group = "ambient_humidity"
