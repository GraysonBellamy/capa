# Standalone ambient sensors on an MCP2221 USB-I2C bridge: an SHT4x
# (temperature, relative humidity) and a BMP58x barometer (pressure, plus
# the barometer's own temperature) daisy-chained on one I2C bus.
#
# Logs the lab's air temperature, humidity and pressure at 1 Hz. The bridge
# is found by USB vendor/product id; with one bridge on the PC no serial is
# needed. Both adapters open the same bridge, so they share one worker and
# one HID handle. Neither sensor is required by the CAPA profile, so a
# fault only degrades the run (on_failure = "warn").

name = "sht4x_real"

[[devices]]
name = "ambient"
adapter = "capa.devices.sht4x"
on_failure = "warn"

[devices.params]
i2c_address = 0x44
precision = "high"
rate_hz = 1.0
i2c_speed_hz = 100000
auto_reconnect = true
snapshot_period_s = 30.0

# BMP58x barometer on the same MCP2221 bridge as the SHT4x: both adapters
# share one worker and one HID handle, so i2c_speed_hz (when set) must match.
[[devices]]
name = "baro"
adapter = "capa.devices.bmp58x"
on_failure = "warn"

[devices.params]
i2c_address = 0x47
pressure_oversampling = 64
temperature_oversampling = 4
rate_hz = 1.0
i2c_speed_hz = 100000
auto_reconnect = true
snapshot_period_s = 30.0

[[channels]]
name = "ambient.temperature"
kind = "temperature"
unit = "degC"
derived_unit = "degC"
plot_group = "ambient"

[channels.source]
source = "sht4x_reading"
device = "ambient"
field = "temperature"

[channels.calibration]
kind = "identity"
input_unit = "degC"
output_unit = "degC"

[channels.metadata]
capa_group = "ambient_temperature"

[[channels]]
name = "ambient.humidity"
kind = "humidity"
unit = "percent"
derived_unit = "percent"
plot_group = "ambient"

[channels.source]
source = "sht4x_reading"
device = "ambient"
field = "humidity"

[channels.calibration]
kind = "identity"
input_unit = "percent"
output_unit = "percent"

[channels.metadata]
capa_group = "ambient_humidity"

[[channels]]
name = "ambient.pressure"
kind = "pressure"
unit = "Pa"
derived_unit = "Pa"
plot_group = "ambient_pressure"

[channels.source]
source = "bmp58x_reading"
device = "baro"
field = "pressure"

[channels.calibration]
kind = "identity"
input_unit = "Pa"
output_unit = "Pa"

[channels.metadata]
capa_group = "ambient_pressure"

[[channels]]
name = "ambient.baro_temperature"
kind = "temperature"
unit = "degC"
derived_unit = "degC"
plot_group = "ambient"

[channels.source]
source = "bmp58x_reading"
device = "baro"
field = "temperature"

[channels.calibration]
kind = "identity"
input_unit = "degC"
output_unit = "degC"

[channels.metadata]
capa_group = "ambient_temperature"
