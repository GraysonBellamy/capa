name = "watlow_real"

# Single real Watlow temperature controller. Adjust ``port``, ``address``,
# and ``protocol`` to match the rig wiring; the defaults are the
# EZ-ZONE PM Standard Bus factory settings (38400 8-N-1).
[[devices]]
name = "heater"
adapter = "capa.devices.watlow"
[devices.params]
port = "COM6"
address = 1
protocol = "stdbus"
parameters = ["process_value", "setpoint"]
instances = [1]
rate_hz = 1.0
auto_reconnect = true
snapshot_period_s = 30.0
identify_on_open = true
# Operator-asserted wire scale (watlowlib 0.4 requires this).
# Empirically verified on PM3R1CA fw=1: with panel set to °C, panel
# reads PV=18.7 and SP=-6.7 while comms reports 65.65 and 20.0 —
# 65.65°F = 18.69°C, 20°F = -6.67°C. The wire is in Fahrenheit
# regardless of what panel-display registers (3005/17050) report. The
# channel calibrations below convert F → C so downstream stays in °C.
wire_temperature_unit = "F"

# --- Channels ---
# Wire is °F (above); channels declare unit=degF and use a two-point
# linear calibration to deliver derived_unit=degC. The reference pairs
# are the F/C definition points: (32 °F, 0 °C) and (212 °F, 100 °C).

[[channels]]
name = "heater.pv"
kind = "process_var"
unit = "degF"
derived_unit = "degC"
plot_group = "temperatures"
[channels.source]
source = "watlow_parameter"
device = "heater"
parameter = "process_value"
instance = 1
[channels.calibration]
kind = "linear_two_point"
input_unit = "degF"
output_unit = "degC"
ref_low_raw = 32.0
ref_low_value = 0.0
ref_high_raw = 212.0
ref_high_value = 100.0

[[channels]]
name = "heater.setpoint"
kind = "setpoint"
unit = "degF"
derived_unit = "degC"
plot_group = "temperatures"
[channels.source]
source = "watlow_parameter"
device = "heater"
parameter = "setpoint"
instance = 1
[channels.calibration]
kind = "linear_two_point"
input_unit = "degF"
output_unit = "degC"
ref_low_raw = 32.0
ref_low_value = 0.0
ref_high_raw = 212.0
ref_high_value = 100.0
