name = "webcam_real"

# Single visible-spectrum USB webcam. Windows DirectShow input form is
# ``video=<friendly-name>``; the friendly name comes from the OS (Device
# Manager → Cameras, or ``ffmpeg -f dshow -list_devices true -i dummy``).
# On Linux replace with ``input_format = "v4l2"`` + ``/dev/videoN``.
[[cameras]]
name = "visible_cam0"
adapter = "capa.devices.camera.webcam"
kind = "visible"
estimated_bps = 1_500_000   # 30 fps H.264 720p ≈ 2 Mbps; 1.5 MB/s gives generous headroom
on_failure = "warn"
[cameras.params]
fps = 30
width = 1280
height = 720
codec = "libx264"
pix_fmt = "yuv420p"
input_format = "dshow"
input_url = "video=Logitech Webcam C930e"
