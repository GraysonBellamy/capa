name = "hf_transient"
description = "Transient heat flux at the specimen position: air purge on, 2 min baseline, heater on the chamber until the operator moves it off, 2 min after, purge off. The heater is never commanded: it keeps the setpoint the tune left it holding."

[[steps]]
kind = "prompt"
title = "Before the test"
message = "Heater tuned and HOLDING at this flux, off the chamber; reference gauge removed. 175681 at the specimen centre, face level with the sample surface, cooling water flowing, body temperature flat on the plot. Chamber closed; air supply open; Alicat setpoint source on serial. Continue turns the purge on (185 SLPM), then records 30 s of flush and the 2 min baseline."
notes = "hftrans win=checklist"

[[steps]]
kind = "setpoint"
value = 185.0
notes = "hftrans win=purge_on"

[steps.target]
name = "purge.setpoint"

# No flow (air supply shut) ends the run here, before the baseline.
[[steps]]
kind = "wait"
timeout_s = 30.0
on_timeout = "abort"
notes = "hftrans win=purge_reach"

[steps.end_condition]
channel = "purge.flow"
op = ">="
value = 180.0

[[steps]]
kind = "acquire"
duration_s = 30.0
notes = "hftrans win=flush"

[[steps]]
kind = "acquire"
duration_s = 120.0
notes = "hftrans win=baseline"

[[steps]]
kind = "prompt"
title = "Heater on"
message = "Slide the heater onto the chamber, then Continue."
notes = "hftrans win=move_on"

[[steps]]
kind = "prompt"
title = "Heater on the chamber"
message = "Test running. When it is time, slide the heater off the chamber, then Continue straight away: that starts the 2 min post-heater record."
notes = "hftrans win=active"

[[steps]]
kind = "acquire"
duration_s = 120.0
notes = "hftrans win=post"

[[steps]]
kind = "setpoint"
value = 0.0
notes = "hftrans win=purge_off"

[steps.target]
name = "purge.setpoint"
