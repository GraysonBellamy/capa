name = "hfg_transfer_cal"
description = "HFG2 transfer calibration against the reference: 5-70 kW/m2 up, 50/30/10 down; R D R with 70 s windows per level."

[[steps]]
kind = "prompt"
title = "Before heating"
message = "Cooling water flowing through both gauges; HFG2 body temperature flat on the plot (drifting less than 0.02 degC/min) and above the dew point; both gauges seated with faces level; heater cold (PV within 2 degC of the room) and at stop A, centred on the REFERENCE. Continue to record the zero; the heater heats to level 1 after it."
notes = "hfgcal win=checklist"

[[steps]]
kind = "acquire"
duration_s = 120.0
notes = "hfgcal level=00 win=Z1"

[[steps]]
kind = "setpoint"
value = 268.0
notes = "hfgcal level=01 q=5 dir=up win=command"

[steps.target]
name = "heater.setpoint"

[[steps]]
kind = "wait"
timeout_s = 1200.0
on_timeout = "warn"
notes = "hfgcal level=01 q=5 dir=up win=reach"

[steps.end_condition]
channel = "heater.pv"
op = ">="
value = 267.0

[[steps]]
kind = "acquire"
duration_s = 900.0
notes = "hfgcal level=01 q=5 dir=up win=settle"

[[steps]]
kind = "acquire"
duration_s = 70.0
notes = "hfgcal level=01 q=5 dir=up win=R1"

[[steps]]
kind = "prompt"
title = "Level 1 of 12: ~5 kW/m2 (up)"
message = "Slide the heater to stop B (centred on HFG2), then Continue."
notes = "hfgcal level=01 q=5 dir=up win=move"

[[steps]]
kind = "acquire"
duration_s = 70.0
notes = "hfgcal level=01 q=5 dir=up win=D"

[[steps]]
kind = "prompt"
title = "Level 1 of 12: ~5 kW/m2 (up)"
message = "Slide the heater to stop A (centred on the REFERENCE gauge), then Continue."
