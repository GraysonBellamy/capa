name = "hfg_transfer_cal_from05"
description = "HFG2 transfer calibration resumed at level 5 of 12; same levels, tags and timing as hfg_transfer_cal."

[[steps]]
kind = "prompt"
title = "Resume"
message = "Resuming at level 5. Cooling water flowing through both gauges; HFG2 body temperature flat on the plot; gauges, stops and faces untouched since the interrupted run; heater at stop A, centred on the REFERENCE. No zero is recorded: the analysis uses the interrupted run's cold zero."
notes = "hfgcal win=checklist"

[[steps]]
kind = "setpoint"
value = 602.0
notes = "hfgcal level=05 q=30 dir=up win=command"

[steps.target]
name = "heater.setpoint"

[[steps]]
kind = "wait"
timeout_s = 1200.0
on_timeout = "warn"
notes = "hfgcal level=05 q=30 dir=up win=reach"

[steps.end_condition]
channel = "heater.pv"
op = ">="
value = 601.0

[[steps]]
kind = "acquire"
duration_s = 600.0
notes = "hfgcal level=05 q=30 dir=up win=settle"

[[steps]]
kind = "acquire"
duration_s = 70.0
notes = "hfgcal level=05 q=30 dir=up win=R1"

[[steps]]
kind = "prompt"
title = "Level 5 of 12: ~30 kW/m2 (up)"
message = "Slide the heater to stop B (centred on HFG2), then Continue."
notes = "hfgcal level=05 q=30 dir=up win=move"

[[steps]]
kind = "acquire"
duration_s = 70.0
notes = "hfgcal level=05 q=30 dir=up win=D"

[[steps]]
kind = "prompt"
title = "Level 5 of 12: ~30 kW/m2 (up)"
