name = "rad_transfer_cal_single"
description = "Radiometer 222091 transfer calibration against the reference: 5-70 kW/m2 up, 50/30/10 down; R D R per level, N2 purge held at 0.2 L/min."

[[steps]]
kind = "prompt"
title = "Before heating"
message = "Cooling water flowing through both gauges at a steady rate; N2 cylinder and regulator open (the method sets the purge to 0.2 L/min now and holds it); Alicat setpoint source on serial; radiometer window clean; both gauges seated, top faces level; heater cold (PV within 2 degC of the room) and at stop A, centred on the REFERENCE; both gauge signals flat on the plot. Continue to record the zero at 0.2 L/min (3 min); the heater heats to level 1 after it."
notes = "hfgcal win=checklist"

[[steps]]
kind = "setpoint"
value = 200.0
notes = "hfgcal level=00 purge=200 win=purge"

[steps.target]
name = "purge.setpoint"

[[steps]]
kind = "acquire"
duration_s = 300.0
notes = "hfgcal level=00 purge=200 win=settleZ1"

[[steps]]
kind = "acquire"
duration_s = 120.0
notes = "hfgcal level=00 purge=200 win=Z1"

[[steps]]
kind = "setpoint"
value = 268.0
notes = "hfgcal level=01 q=5 dir=up purge=200 win=command"

[steps.target]
name = "heater.setpoint"

[[steps]]
kind = "wait"
timeout_s = 1200.0
on_timeout = "warn"
notes = "hfgcal level=01 q=5 dir=up purge=200 win=reach"

[steps.end_condition]
channel = "heater.pv"
op = ">="
value = 267.0

[[steps]]
kind = "acquire"
duration_s = 900.0
notes = "hfgcal level=01 q=5 dir=up purge=200 win=settle"

[[steps]]
kind = "acquire"
