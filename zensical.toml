[project.theme]
variant = "classic"
custom_dir = "overrides"
features = [
    "content.code.copy",
    "content.code.annotate",
    "content.tooltips",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.tracking",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.sections",
    "navigation.indexes",
    "navigation.path",
    "navigation.footer",
    "navigation.top",
    "search.highlight",
    "search.suggest",
    "toc.follow",
]

# CAPA uses a warm palette (orange + deep orange) to distinguish it from the
# device-library docs sites (alicatlib, watlowlib, etc.), which use deep purple.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "orange"
accent = "deep orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "orange"
accent = "deep orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "table"
show_source = true
show_root_heading = true
show_signature_annotations = true
show_if_no_docstring = false
merge_init_into_class = true
separate_signature = true
inherited_members = true
members_order = "source"
# Hide Qt event-method overrides (their contract is documented upstream by Qt)
# and any leading-underscore internal helpers from the rendered API pages.
filters = [
    "!^_",
    "!Event$",
    "!^paintEvent$",
    "!^mouse(Press|Release|Move|DoubleClick)Event$",
    "!^key(Press|Release)Event$",
    "!^close(Event)?$",
    "!^show(Event)?$",
    "!^hide(Event)?$",
    "!^focus(In|Out)Event$",
    "!^resize(Event)?$",
    "!^leave(Event)?$",
    "!^enter(Event)?$",
]

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]
base_path = [".", "docs"]
check_paths = true

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true
